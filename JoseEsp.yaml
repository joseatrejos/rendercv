          - Implementé un motor de decisión en tiempo real (ruteo rojo/verde) para el control del flujo vehicular bajo restricciones estrictas de latencia.
          - Construí orquestación en Python que maneja captura concurrente de imágenes, buffer en Redis, procesamiento OCR y persistencia en PostgreSQL.
          - Implementé sistemas de monitoreo de infraestructura para asegurar la conectividad e integridad operacional de PLCs, cámaras, sensores, servidores y dispositivos edge en las capas de energía, red y control.
          - Diseñé la arquitectura de una plataforma centralizada de monitoreo (Django + Grafana) que habilita observabilidad en tiempo real, alertas automatizadas y visualización geoespacial de las aduanas a nivel nacional, incluyendo detección de listas negras para vehículos y reconocimiento facial.
 

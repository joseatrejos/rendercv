        highlights:
          - Lideré el diseño e implementación de COVeLi, un sistema SCADA nacional desplegado en 51 aduanas con acceso LAN restringido y un Centro de Operaciones de Red (NOC) nacional para monitoreo en tiempo real y respuesta a incidentes.

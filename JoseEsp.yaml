          - Puse en marcha una fábrica de software operativa con un nulo costo de herramientas aprovechando plataformas open-source, eliminando la dependencia de soluciones propietarias.
          - Diseñé modelos de costos en las operaciones de ingeniería, habilitando la toma de decisiones basada en P&L y definiendo metas de ingresos para un crecimiento sostenible.
